<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Health & Diet Dashboard</title>
    <style>
        :root {
            --primary: #2ecc71;
            --dark: #2c3e50;
            --light: #f8f9fa;
            --shadow: 0 4px 15px rgba(0,0,0,0.05);
            --danger: #e74c3c;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f3f4; margin: 0; padding: 40px; color: var(--dark); }
        .container { max-width: 800px; background: white; padding: 30px; border-radius: 16px; box-shadow: var(--shadow); margin: 0 auto; }
        
        /* Navigation Tabs */
        .menu-tabs { display: flex; gap: 10px; margin-bottom: 25px; background: var(--light); padding: 5px; border-radius: 8px; }
        .tab-btn { flex: 1; padding: 12px; background: none; border: none; font-size: 15px; font-weight: 600; color: #7f8c8d; cursor: pointer; border-radius: 6px; transition: 0.2s; }
        .tab-btn.active { background: white; color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        
        .app-section { display: none; }
        .app-section.active { display: block; }
        
        /* Form Elements */
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; font-size: 14px; transition: 0.2s; }
        input:focus, select:focus { border-color: var(--primary); outline: none; }
        
        .submit-btn { background: var(--primary); color: white; padding: 14px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; box-shadow: 0 4px 12px rgba(46, 204, 113, 0.2); }
        .submit-btn:hover { background: #27ae60; }

        /* Graphics Layout */
        .result-card { margin-top: 30px; background: var(--light); border-radius: 12px; padding: 25px; border: 1px solid #e2e8f0; display: none; }
        .badge { background: #e8f8f0; color: var(--primary); padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        
        /* Error Message Box (Replaces alerts) */
        .error-box { background: #fdf2f2; color: var(--danger); border: 1px solid #f8b4b4; padding: 15px; border-radius: 8px; margin-top: 20px; display: none; font-weight: 600; }

        /* Weekday Grid Navigation */
        .days-nav { display: flex; gap: 5px; margin: 20px 0; overflow-x: auto; padding-bottom: 5px; }
        .day-tab { padding: 8px 14px; background: #e2e8f0; border: none; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600; white-space: nowrap; transition: 0.2s; }
        .day-tab.active { background: var(--primary); color: white; }

        /* Grid Layout Cards */
        .meal-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        .meal-card { background: white; padding: 18px; border-radius: 10px; border-left: 4px solid var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .meal-time { font-size: 12px; text-transform: uppercase; color: #95a5a6; font-weight: bold; letter-spacing: 1px; }
        .meal-name { font-size: 15px; font-weight: 600; margin: 5px 0 0 0; color: var(--dark); }
    </style>
</head>
<body>

<div class="container">
    <div class="menu-tabs">
        <button class="tab-btn active" onclick="switchTab('categorizer')">Age Categorizer</button>
        <button class="tab-btn" onclick="switchTab('diet')">AI Diet Planner</button>
    </div>

    <!-- Tab 1: Age Categorizer -->
    <div id="categorizer" class="app-section active">
        <h2>Check Your Age Category</h2>
        <form id="categorizerForm">
            <div class="form-group">
                <label>Enter Age (0-60):</label>
                <input type="text" id="catAge" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 25" oninput="this.value = this.value.replace(/[^0-9]/g, ''); if(parseInt(this.value) > 60) this.value = 60;" required>
            </div>
            <button type="submit" class="submit-btn">Check Category</button>
        </form>
        <div id="catResultBox" class="result-card">
            <p>Your Category: <span class="badge" id="catResultText"></span></p>
        </div>
    </div>

    <!-- Tab 2: AI Diet Planner -->
    <div id="diet" class="app-section">
        <h2>Personalized AI Diet Planner</h2>
        <form id="plannerForm">
            <div class="form-group"><label>Name:</label><input type="text" id="name" required></div>
            <div class="form-group">
                <label>Age (0-60):</label>
                <input type="text" id="dietAge" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 35" oninput="this.value = this.value.replace(/[^0-9]/g, ''); if(parseInt(this.value) > 60) this.value = 60;" required>
            </div>
            <div class="form-group">
                <label>Health Focus:</label>
                <select id="focus">
                    <option value="General Balanced Diet">General Balanced Diet</option>
                    <option value="Iron Deficiency (Anemia)">Iron Deficiency (Anemia)</option>
                    <option value="Vitamin D & Calcium Boost">Vitamin D & Calcium Boost</option>
                    <option value="High Protein for Muscle Development">High Protein Development</option>
                </select>
            </div>
            <button type="submit" class="submit-btn">Generate UI Graphical Plan</button>
        </form>

        <!-- Error box for user-friendly notifications -->
        <div id="errorBox" class="error-box"></div>

        <!-- Graphical Results Presentation -->
        <div id="dietResultBox" class="result-card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3>Diet Dashboard for <span id="resName" style="color:var(--primary)"></span></h3>
                <span class="badge" id="resCategory"></span>
            </div>
            
            <p id="loadingMsg" style="color: #7f8c8d; font-style: italic; display:none;">AI is compiling your calendar dashboard layout...</p>
            
            <div id="dashboardContent" style="display:none;">
                <div class="days-nav" id="daysNavContainer"></div>
                <div class="meal-grid" id="mealGridContainer"></div>
            </div>
        </div>
    </div>
</div>

<script>
    let globalMealPlanData = null;

    function switchTab(tabId) {
        document.querySelectorAll('.app-section').forEach(sec => sec.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
        hideError();
    }

    function showError(msg) {
        const errBox = document.getElementById('errorBox');
        errBox.innerText = msg;
        errBox.style.display = 'block';
        document.getElementById('loadingMsg').style.display = 'none';
    }

    function hideError() {
        document.getElementById('errorBox').style.display = 'none';
    }

    // Tab 1 logic
    document.getElementById('categorizerForm').onsubmit = async (e) => {
        e.preventDefault();
        hideError();
        try {
            const response = await fetch('/api/categorize', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ age: document.getElementById('catAge').value })
            });
            const result = await response.json();
            document.getElementById('catResultText').innerText = result.category;
            document.getElementById('catResultBox').style.display = 'block';
        } catch(err) {
            showError("Could not reach backend to categorize age. Make sure your server is running!");
        }
    };

    // Tab 2 logic
    document.getElementById('plannerForm').onsubmit = async (e) => {
        e.preventDefault();
        hideError();
        document.getElementById('loadingMsg').style.display = 'block';
        document.getElementById('dashboardContent').style.display = 'none';
        document.getElementById('dietResultBox').style.display = 'block';

        const data = {
            name: document.getElementById('name').value,
            age: document.getElementById('dietAge').value,
            focus: document.getElementById('focus').value
        };

        try {
            const response = await fetch('/api/plan', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            
            const result = await response.json();
            document.getElementById('loadingMsg').style.display = 'none';
            
            if(result.error) {
                showError(result.error);
                return;
            }

            document.getElementById('resName').innerText = data.name;
            document.getElementById('resCategory').innerText = result.category;
            
            globalMealPlanData = result.meal_plan;
            renderDaysMenu();
            showDayMeals(Object.keys(globalMealPlanData)[0]); // Set Monday default tab view active
            document.getElementById('dashboardContent').style.display = 'block';
        } catch(err) {
            showError("Network Error: Could not connect to the server. Check your command prompt console!");
        }
    };

    function renderDaysMenu() {
        const container = document.getElementById('daysNavContainer');
        container.innerHTML = '';
        Object.keys(globalMealPlanData).forEach((day, index) => {
            const btn = document.createElement('button');
            btn.className = `day-tab ${index === 0 ? 'active' : ''}`;
            btn.innerText = day;
            btn.onclick = (e) => {
                document.querySelectorAll('.day-tab').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                showDayMeals(day);
            };
            container.appendChild(btn);
        });
    }

    function showDayMeals(day) {
        const container = document.getElementById('mealGridContainer');
        container.innerHTML = '';
        const dayMeals = globalMealPlanData[day];
        
        const periods = ['Morning', 'Afternoon', 'Night'];
        periods.forEach(period => {
            const card = document.createElement('div');
            card.className = 'meal-card';
            card.innerHTML = `
                <div class="meal-time">${period}</div>
                <p class="meal-name">${dayMeals[period] || 'Balanced Selection'}</p>
            `;
            container.appendChild(card);
        });
    }
</script>
</body>
</html>
