<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DietCat - Age Categorizer & AI Diet Planner</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl max-w-2xl w-full p-8 border border-gray-100">
        
        <div class="flex border-b border-gray-200 mb-8">
            <button id="tab-categorizer" class="w-1/2 pb-4 text-center font-semibold text-green-600 border-b-2 border-green-500 focus:outline-none">
                Age Categorizer
            </button>
            <button id="tab-diet" class="w-1/2 pb-4 text-center font-semibold text-gray-400 hover:text-gray-600 focus:outline-none">
                AI Diet Planner
            </button>
        </div>

        <div id="section-categorizer" class="block">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Check Your Age Category</h2>
            <p class="text-gray-500 mb-6">Enter an age to classify it using our C++ backend.</p>
            
            <form id="categorizer-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Enter Age (0-60):</label>
                    <input type="number" id="age-input" name="age" min="0" max="60" required 
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition">
                </div>
                
                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl transition shadow-md shadow-emerald-100">
                    Check Category
                </button>
            </form>

            <div class="mt-6 p-4 bg-gray-50 rounded-xl border border-gray-100">
                <span class="text-gray-600 font-medium">Your Category:</span>
                <span id="category-output" class="ml-2 font-bold text-gray-400">Not checked yet</span>
            </div>
        </div>

        <div id="section-diet" class="hidden">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">AI Diet Planner</h2>
            <p class="text-gray-500 mb-6">Generate a custom 1-day meal plan based on your category and fitness goals.</p>
            
            <form id="diet-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Fitness Goal:</label>
                    <select id="goal-input" name="goal" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition">
                        <option value="Lose Weight">Lose Weight</option>
                        <option value="Build Muscle">Build Muscle</option>
                        <option value="Stay Healthy / Maintain">Stay Healthy / Maintain</option>
                    </select>
                </div>
                
                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl transition shadow-md shadow-emerald-100">
                    Generate Diet Plan
                </button>
            </form>

            <div class="mt-6 p-4 bg-gray-50 rounded-xl border border-gray-100">
                <h3 class="text-gray-700 font-semibold mb-2">Your Custom Plan:</h3>
                <div id="diet-output" class="text-gray-600 whitespace-pre-line leading-relaxed text-sm">
                    Your generated diet plan will appear here...
                </div>
            </div>
        </div>

    </div>

    <script>
        // Tab switching setup
        const tabCategorizer = document.getElementById('tab-categorizer');
        const tabDiet = document.getElementById('tab-diet');
        const sectionCategorizer = document.getElementById('section-categorizer');
        const sectionDiet = document.getElementById('section-diet');

        let verifiedCategory = ""; // Tracks category globally for the diet planner

        tabCategorizer.addEventListener('click', () => {
            tabCategorizer.className = "w-1/2 pb-4 text-center font-semibold text-green-600 border-b-2 border-green-500 focus:outline-none";
            tabDiet.className = "w-1/2 pb-4 text-center font-semibold text-gray-400 hover:text-gray-600 focus:outline-none";
            sectionCategorizer.className = "block";
            sectionDiet.className = "hidden";
        });

        tabDiet.addEventListener('click', () => {
            tabDiet.className = "w-1/2 pb-4 text-center font-semibold text-green-600 border-b-2 border-green-500 focus:outline-none";
            tabCategorizer.className = "w-1/2 pb-4 text-center font-semibold text-gray-400 hover:text-gray-600 focus:outline-none";
            sectionDiet.className = "block";
            sectionCategorizer.className = "hidden";
        });

        // FIX 1: Age Categorizer Submission (Relative Path & Exact JSON Match)
        document.getElementById('categorizer-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const ageInput = document.getElementById('age-input').value;
            const outputSpan = document.getElementById('category-output');
            
            outputSpan.innerText = "Processing...";
            outputSpan.className = "ml-2 font-bold text-amber-500";

            const formData = new FormData();
            formData.append('age', ageInput);

            // Using relative URL so it auto-targets Render when deployed
            fetch('/api/categorize', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (!response.ok) throw new Error("Server error or binary execution failed");
                return response.json();
            })
            .then(data => {
                // Supports both potential key shapes to avoid 'undefined'
                const categoryResult = data.category || data.result;
                
                if (categoryResult) {
                    verifiedCategory = categoryResult; // Save it for the diet tab
                    outputSpan.innerText = categoryResult;
                    outputSpan.className = "ml-2 font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded";
                } else if (data.error) {
                    outputSpan.innerText = "Error: " + data.error;
                    outputSpan.className = "ml-2 font-bold text-red-500";
                }
            })
            .catch(err => {
                outputSpan.innerText = "Connection Error";
                outputSpan.className = "ml-2 font-bold text-red-500";
                console.error(err);
            });
        });

        // FIX 2: AI Diet Planner Submission (Relative Path & Fallback Logic)
        document.getElementById('diet-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const goalInput = document.getElementById('goal-input').value;
            const dietOutput = document.getElementById('diet-output');

            if (!verifiedCategory) {
                dietOutput.innerHTML = "<span class='text-red-500 font-semibold'>⚠️ Please run the Age Categorizer tab first to identify your category!</span>";
                return;
            }

            dietOutput.innerText = "Formulating your meal plan via Gemini AI...";
            
            const formData = new FormData();
            formData.append('category', verifiedCategory);
            formData.append('goal', goalInput);

            // Using relative URL to bypass local Network Errors
            fetch('/generate_diet', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (!response.ok) throw new Error("API Key issue or server route failure");
                return response.json();
            })
            .then(data => {
                if (data.diet_plan) {
                    dietOutput.innerText = data.diet_plan;
                } else if (data.error) {
                    dietOutput.innerHTML = `<span class='text-red-500'>Error: ${data.error}</span>`;
                }
            })
            .catch(err => {
                dietOutput.innerHTML = "<span class='text-red-500'>Network Error: Could not connect to Render backend.</span>";
                console.error(err);
            });
        });
    </script>
</body>
</html>
